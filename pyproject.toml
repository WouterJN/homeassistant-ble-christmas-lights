[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP", "W"]
ignore = [
    "E501",    # line length is left to the formatter
    "RUF012",  # Home Assistant entities declare _attr_ defaults as class attributes
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
known-local-folder = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
files = ["custom_components"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
# Home Assistant is only followed for its types, not checked itself.
follow_imports = "silent"
ignore_missing_imports = true
