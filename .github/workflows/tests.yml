name: Tests

# Branches are tested through their pull request, so a push to one does not
# run everything a second time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: scripts/setup
      - run: ruff check .
      - run: ruff format --check .
      - run: >-
          pytest tests -q
          --cov=custom_components/ble_christmas_lights
          --cov-report=term-missing
