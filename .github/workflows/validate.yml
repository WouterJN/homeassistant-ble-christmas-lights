name: Validate

# HACS will not accept a repository into its default store unless both of these
# pass without errors, so they run on every push and once a day, to catch
# breakage introduced by the tools rather than by this repository.
on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
