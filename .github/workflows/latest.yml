name: Latest Home Assistant

# The other tests run against the Home Assistant version pinned in
# requirements-dev.txt. This runs them once a week against the newest one, to
# find out about changes in Home Assistant that break the integration before
# its users do. When it fails while "Tests" passes: fix the integration, then
# raise the pin.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: scripts/setup --latest
      - run: pip list | grep -iE "^(homeassistant|pytest-homeassistant-custom-component) "
      - run: pytest tests -q
